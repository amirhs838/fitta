name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build downloadable Android APK
    runs-on: ubuntu-latest
    env:
      CAPACITOR_SERVER_URL: https://fitta-fawn.vercel.app
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npm run mobile:sync -- android

      - name: Build debug APK
        run: ./android/gradlew -p android assembleDebug

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: Fitta ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}

      - name: Upload APK build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: fitta-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
