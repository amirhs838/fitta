<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>فیتا</title>
    <style>
      :root { color: #1c1b18; background: #f6f7f2; font-family: Vazirmatn, Tahoma, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 420px); padding: 32px 24px; border-radius: 24px; background: #fff; box-shadow: 0 12px 32px rgba(31, 77, 58, .12); text-align: center; }
      .mark { width: 56px; height: 56px; display: grid; place-items: center; margin: 0 auto 20px; border-radius: 18px; background: #1f4d3a; color: #fff; font-weight: 800; font-size: 24px; }
      h1 { margin: 0; font-size: 24px; } p { margin: 14px 0 0; line-height: 1.9; color: rgba(28, 27, 24, .7); font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">ف</div>
      <h1>فیتا آمادهٔ اتصال است</h1>
      <p>برای اجرای نسخهٔ موبایل، آدرس نسخهٔ منتشرشدهٔ اپ را هنگام همگام‌سازی Capacitor تنظیم کن.</p>
    </main>
  </body>
</html>
